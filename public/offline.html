<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sin conexión - Ferretería Central</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
               margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .card { max-width: 28rem; text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; }
        button { margin-top: 1.5rem; padding: 0.75rem 1.5rem; background: #ea580c; color: white;
                 border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h1>⚠ Sin conexión</h1>
        <p>No hay internet ahora mismo. Verificá tu red e intentá de nuevo. Los datos que ya cargaste están en caché.</p>
        <button onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
