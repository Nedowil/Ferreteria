{% extends "base.html" %}
{% block header %}{{ title }}{% endblock %}
{% block content %}
<div class="max-w-lg bg-white rounded-lg shadow p-6">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-4">
            <label class="block text-sm font-medium mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<p class="text-red-600 text-xs mt-1">{{ field.errors|join:", " }}</p>{% endif %}
        </div>
        {% endfor %}
        <div class="flex gap-2 mt-6">
            <button class="bg-blue-600 text-white rounded px-5 py-2 text-sm font-medium">Guardar</button>
            <a href="{% url cancel_url %}" class="px-5 py-2 text-sm text-slate-500">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
