{% if page_obj.has_other_pages %}
<div class="flex items-center justify-center gap-1 mt-4 text-sm">
    {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}" class="px-3 py-1 bg-white border rounded">‹</a>
    {% endif %}
    <span class="px-3 py-1 text-slate-500">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}" class="px-3 py-1 bg-white border rounded">›</a>
    {% endif %}
</div>
{% endif %}
