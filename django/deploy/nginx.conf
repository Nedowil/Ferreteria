# nginx: termina TLS y hace proxy al backend (gunicorn en web:8000).
# Requiere certificados (p. ej. con certbot). Reemplaza el server_name y las
# rutas de los certificados por los de tu dominio.

server {
    listen 80;
    server_name ferreteria.example.com;

    # Reto de certbot (HTTP-01) y redirección del resto a HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ferreteria.example.com;

    ssl_certificate     /etc/letsencrypt/live/ferreteria.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ferreteria.example.com/privkey.pem;

    # Subidas (CSV de importación, imágenes de productos).
    client_max_body_size 10M;

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django respeta este encabezado (SECURE_PROXY_SSL_HEADER) para saber
        # que la conexión original fue HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
